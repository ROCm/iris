# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    # Wait for a release to age before proposing it, so a compromised or
    # broken publish has time to be caught upstream (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # ruff is pinned below 0.16 here and in lint.yml (#547): 0.16 formats code
    # blocks in Markdown. Dependabot can only bump the pyproject.toml copy, which
    # silently splits local and CI formatting (#560, #601). Move both by hand.
    ignore:
      - dependency-name: "ruff"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-deps:
        patterns:
          - "*"
