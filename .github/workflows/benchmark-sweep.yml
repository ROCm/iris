name: Example 10 Benchmark Sweep

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to post results to (optional)"
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "examples/10_gemm_all_scatter_wg_specialization/**"
      - ".github/workflows/benchmark-sweep.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'iris-dev-triton-aafec41' }}

jobs:
  sweep-2-ranks:
    name: Benchmark Sweep (2 ranks)
    runs-on: [linux-mi325-8gpu-ossci-rad]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: bash .github/scripts/container_build.sh

      - name: Acquire GPUs
        run: bash .github/scripts/acquire_gpus.sh 2

      - name: Run sweep with 2 ranks
        run: |
          set -e
          bash .github/scripts/container_exec.sh --gpus "$GPU_DEVICES" "
            set -e
            cd /iris_workspace
            pip install -e .
            cd examples/10_gemm_all_scatter_wg_specialization
            torchrun --rdzv-backend=c10d --rdzv-endpoint=localhost:0 \
                     --nnodes=1 --nproc_per_node=2 \
                     sweep_benchmark.py --output_file /iris_workspace/sweep_2ranks.json
          "

      - name: Upload sweep results
        uses: actions/upload-artifact@v4
        with:
          name: sweep-results-2ranks
          path: sweep_2ranks.json

      - name: Release GPUs
        if: always()
        run: bash .github/scripts/release_gpus.sh

  sweep-4-ranks:
    name: Benchmark Sweep (4 ranks)
    runs-on: [linux-mi325-8gpu-ossci-rad]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: bash .github/scripts/container_build.sh

      - name: Acquire GPUs
        run: bash .github/scripts/acquire_gpus.sh 4

      - name: Run sweep with 4 ranks
        run: |
          set -e
          bash .github/scripts/container_exec.sh --gpus "$GPU_DEVICES" "
            set -e
            cd /iris_workspace
            pip install -e .
            cd examples/10_gemm_all_scatter_wg_specialization
            torchrun --rdzv-backend=c10d --rdzv-endpoint=localhost:0 \
                     --nnodes=1 --nproc_per_node=4 \
                     sweep_benchmark.py --output_file /iris_workspace/sweep_4ranks.json
          "

      - name: Upload sweep results
        uses: actions/upload-artifact@v4
        with:
          name: sweep-results-4ranks
          path: sweep_4ranks.json

      - name: Release GPUs
        if: always()
        run: bash .github/scripts/release_gpus.sh

  sweep-8-ranks:
    name: Benchmark Sweep (8 ranks)
    runs-on: [linux-mi325-8gpu-ossci-rad]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: bash .github/scripts/container_build.sh

      - name: Acquire GPUs
        run: bash .github/scripts/acquire_gpus.sh 8

      - name: Run sweep with 8 ranks
        run: |
          set -e
          bash .github/scripts/container_exec.sh --gpus "$GPU_DEVICES" "
            set -e
            cd /iris_workspace
            pip install -e .
            cd examples/10_gemm_all_scatter_wg_specialization
            torchrun --rdzv-backend=c10d --rdzv-endpoint=localhost:0 \
                     --nnodes=1 --nproc_per_node=8 \
                     sweep_benchmark.py --output_file /iris_workspace/sweep_8ranks.json
          "

      - name: Upload sweep results
        uses: actions/upload-artifact@v4
        with:
          name: sweep-results-8ranks
          path: sweep_8ranks.json

      - name: Release GPUs
        if: always()
        run: bash .github/scripts/release_gpus.sh

  report:
    name: Generate and Post Roofline Report
    runs-on: ubuntu-latest
    needs: [sweep-2-ranks, sweep-4-ranks, sweep-8-ranks]
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all sweep artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sweep-results-*
          merge-multiple: true

      - name: Generate Markdown report
        run: |
          python .github/scripts/generate_sweep_report.py \
            sweep_2ranks.json sweep_4ranks.json sweep_8ranks.json \
            --output sweep_report.md
          echo "=== Report Preview ==="
          cat sweep_report.md

      - name: Post results as PR comment
        if: ${{ github.event.inputs.pr_number != '' || github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.inputs.pr_number || github.event.number }}"
          BODY=$(cat sweep_report.md)
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          echo "✅ Posted benchmark results to PR #${PR}"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-sweep-report
          path: |
            sweep_report.md
            sweep_2ranks.json
            sweep_4ranks.json
            sweep_8ranks.json
