name: Iris Tests

on:
  push:
    branches: [ main, muhaawad/single-node-ci ]
  pull_request:
    branches: [ main, muhaawad/single-node-ci ]
  workflow_dispatch:  

jobs:
  build-image:
    runs-on: [self-hosted, 8mi300x]
    steps:
      - name: Setup Docker
        run: |
          # Update package list
          apt-get update
          # Install Docker daemon
          apt-get install -y docker.io
          # Start Docker daemon
          dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2376 &
          # Wait for Docker to be ready
          timeout 1m bash -c 'until docker info >/dev/null 2>&1; do sleep 1; done'
      
      - name: Check system information
        run: |
          echo "=== System Information ==="
          ls /opt/
          echo "=== Docker Client Version ==="
          docker --version
          echo "=== Docker Buildx Version ==="
          docker buildx version
      
      - name: Build Iris Docker container
        run: |
          ./docker/build.sh
