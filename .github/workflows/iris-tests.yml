name: Iris Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'iris-dev-triton-aafec41' }}

permissions:
  contents: read

jobs:
  test-git:
    name: Test ${{ matrix.test_dir }} (1/2/4/8 ranks, git install)
    runs-on: [linux-mi350-8gpu-iris]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One job per directory runs every rank count. gpu_task_queue.py takes
        # GPUs per rank count, so these jobs pack onto the node together instead
        # of each holding a runner slot while waiting for a fixed GPU count.
        test_dir: [examples, unittests, ccl, context, ops]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: |
          bash .github/scripts/container_build.sh

      - name: Report environment versions
        run: |
          bash .github/scripts/report_versions.sh

      - name: Run ${{ matrix.test_dir }} tests with 1, 2, 4 and 8 ranks (git install)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/gpu_task_queue.py --install git \
            "${{ matrix.test_dir }}:8" "${{ matrix.test_dir }}:4" \
            "${{ matrix.test_dir }}:2" "${{ matrix.test_dir }}:1"

      - name: Release GPUs
        if: always()
        run: |
          bash .github/scripts/release_gpus.sh

  test-editable:
    name: Test all dirs (2 ranks, editable install)
    needs: [test-git]
    runs-on: [linux-mi350-8gpu-iris]
    timeout-minutes: 180
    # Smoke test: 2 ranks per dir verifies editable install + basic distributed paths

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: |
          bash .github/scripts/container_build.sh

      - name: Run all test dirs with 2 ranks (editable install)
        run: |
          python3 .github/scripts/gpu_task_queue.py --install editable \
            examples:2 unittests:2 ccl:2 context:2 ops:2

      - name: Release GPUs
        if: always()
        run: |
          bash .github/scripts/release_gpus.sh

  test-install:
    name: Test all dirs (2 ranks, pip install)
    needs: [test-git]
    runs-on: [linux-mi350-8gpu-iris]
    timeout-minutes: 180
    # Smoke test: 2 ranks per dir verifies pip install + basic distributed paths

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: |
          bash .github/scripts/container_build.sh

      - name: Run all test dirs with 2 ranks (pip install)
        run: |
          python3 .github/scripts/gpu_task_queue.py --install install \
            examples:2 unittests:2 ccl:2 context:2 ops:2

      - name: Release GPUs
        if: always()
        run: |
          bash .github/scripts/release_gpus.sh

  test-new-examples:
    name: New examples (2/4/8 ranks, editable)
    runs-on: [linux-mi350-8gpu-iris]
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: |
          bash .github/scripts/container_build.sh

      - name: Run new examples with 2, 4 and 8 ranks (editable)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/gpu_task_queue.py --install editable \
            new_examples:8 new_examples:4 new_examples:2

      - name: Release GPUs
        if: always()
        run: |
          bash .github/scripts/release_gpus.sh
