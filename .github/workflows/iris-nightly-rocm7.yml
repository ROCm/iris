name: Iris Nightly ROCm 7.x

# Pull requests run on ROCm 10.1 (apptainer/iris.def). This runs the full test
# suite nightly on ROCm 7.2.1 (apptainer/iris-rocm7.def), so runtime behaviour
# that differs between the two stacks -- VMM granularity and dma-buf re-export
# changed in HIP 7.16 (#630) -- cannot silently break 7.x users.

on:
  schedule:
    # 1 AM Pacific (09:00 UTC), after the nightly Triton test.
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IRIS_DEF_FILE: apptainer/iris-rocm7.def

jobs:
  test-rocm7:
    name: Test ${{ matrix.name }} (ROCm 7.2.1)
    runs-on: [linux-mi350-8gpu-iris]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One job per directory runs every rank count, as in iris-tests.yml.
        include:
          - name: examples
            tasks: examples:8 examples:4 examples:2 examples:1
          - name: unittests
            tasks: unittests:8 unittests:4 unittests:2 unittests:1
          - name: ccl
            tasks: ccl:8 ccl:4 ccl:2 ccl:1
          - name: context
            tasks: context:8 context:4 context:2 context:1
          - name: ops
            tasks: ops:8 ops:4 ops:2 ops:1
          - name: new examples
            tasks: new_examples:8 new_examples:4 new_examples:2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris ROCm 7.2.1 container
        run: |
          bash .github/scripts/container_build.sh

      - name: Report environment versions
        run: |
          bash .github/scripts/report_versions.sh

      - name: Run ${{ matrix.name }} tests (editable install)
        env:
          TASKS: ${{ matrix.tasks }}
        run: |
          # shellcheck disable=SC2086 # TASKS is a space-separated task list
          python3 .github/scripts/gpu_task_queue.py --install editable $TASKS

      - name: Release GPUs
        if: always()
        run: |
          bash .github/scripts/release_gpus.sh
