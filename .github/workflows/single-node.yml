name: Iris Single Node Checks

on:
  push:
    branches: [ main, muhaawad/single-node-ci ]
  pull_request:
    branches: [ main, muhaawad/single-node-ci ]
  workflow_dispatch:  

jobs:
  build-image:
    runs-on: [self-hosted, 1mi300x]
    steps:
      - name: Check system information
        run: |
          echo "=== System Information ==="
          ls /opt/
          echo "=== Docker Client Version ==="
          docker --version || echo "Docker client not accessible"
          echo "=== Docker Buildx Version ==="
          docker buildx version || echo "Docker buildx not accessible"
      
      - name: Install and start Docker daemon
        run: |
          echo "=== Installing Docker daemon ==="
          # Update package list
          apt-get update
          # Install Docker daemon
          apt-get install -y docker.io
          # Start Docker daemon
          dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2376 &
          # Wait for Docker to be ready
          sleep 10
          # Test Docker daemon
          docker info
          echo "=== Docker daemon started successfully ==="
      
      - name: Check Docker daemon status
        run: |
          echo "=== Docker Daemon Status ==="
          echo "=== Docker Socket Check ==="
          ls -la /var/run/docker.sock || echo "Docker socket not found"
          echo "=== Docker Process Check ==="
          ps aux | grep docker || echo "No docker processes found"
          echo "=== Docker Info ==="
          docker info
          echo "=== Test Docker Build ==="
          docker run --rm hello-world || echo "Docker run test failed"
