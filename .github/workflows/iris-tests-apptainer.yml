name: Iris Tests with Apptainer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, mi3008x]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Apptainer
        run: |
          apt-get update && apt-get install -y software-properties-common
          add-apt-repository -y ppa:apptainer/ppa
          apt-get update && apt-get install -y apptainer
          apptainer --version

      - name: Build Iris Apptainer container
        run: |
          df -h /
          # Create persistent Apptainer directory
          mkdir -p ~/apptainer

          # Build Apptainer image from definition file (only if it doesn't exist)
          if [ ! -f ~/apptainer/iris-dev.sif ]; then
            echo "Building new Apptainer image..."
            apptainer build ~/apptainer/iris-dev.sif apptainer/iris.def
          else
            echo "Using existing Apptainer image"
          fi
  test:
    needs: build
    runs-on: [self-hosted, mi3008x]
    timeout-minutes: 20
    strategy:
      matrix:
        ranks: [1]
        #ranks: [1, 2, 4, 8]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.ranks }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Iris Tests with ${{ matrix.ranks }} MPI ranks
        run: |
          apptainer exec ~/apptainer/iris-dev.sif bash -c "
            # Install iris first
            pip install -e .

            # Create alias for mpirun with root permissions
            alias mpirun-root='mpirun --allow-run-as-root'

            # Run ROCm and HIP checks
            rocm-smi
            hipconfig

            # Run MPI test
            mpirun-root -np ${{ matrix.ranks }} echo 'MPI working with ${{ matrix.ranks }} rank(s)'

            # Run examples tests
            echo 'Running examples tests...'
            mpirun-root python -m pytest tests/examples -v --tb=short

            # Run unit tests
            echo 'Running unit tests...'
            mpirun-root python -m pytest tests/unittests -v --tb=short
          "