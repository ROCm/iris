name: Iris Tests with Apptainer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-apptainer-image:
    runs-on: [self-hosted, mi3008x]
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Apptainer
        run: |
          apt-get update && apt-get install -y software-properties-common
          add-apt-repository -y ppa:apptainer/ppa
          apt-get update && apt-get install -y apptainer

      - name: Build Iris Apptainer container
        run: |
          # Create persistent Apptainer directory
          mkdir -p ~/apptainer

          # Build Apptainer image from definition file (only if it doesn't exist)
          if [ ! -f ~/apptainer/iris-dev.sif ]; then
            echo "Building new Apptainer image..."
            apptainer build ~/apptainer/iris-dev.sif apptainer/iris.def
          else
            echo "Using existing Apptainer image"
          fi
  run-tests-parallel:
    name: ${{ matrix.ranks }}-rank Iris Test
    needs: build-apptainer-image
    runs-on: [self-hosted, mi3008x]
    timeout-minutes: 20
    strategy:
      matrix:
        ranks: [1, 2, 4]
        include:
          - ranks: 1
            gpu_devices: "0"
          - ranks: 2
            gpu_devices: "1,2"
          - ranks: 4
            gpu_devices: "3,4,5,6"
      max-parallel: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Iris Tests with ${{ matrix.ranks }} ranks
        run: |
          export ROCR_VISIBLE_DEVICES="${{ matrix.gpu_devices }}"
          apptainer exec ~/apptainer/iris-dev.sif bash .github/scripts/run_tests.sh ${{ matrix.ranks }}

  run-tests-8-ranks:
    name: 8-rank Iris Test
    needs: [build-apptainer-image, run-tests-parallel]
    runs-on: [self-hosted, mi3008x]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Iris Tests with 8 ranks
        run: |
          export ROCR_VISIBLE_DEVICES="0,1,2,3,4,5,6,7"
          apptainer exec ~/apptainer/iris-dev.sif bash .github/scripts/run_tests.sh 8