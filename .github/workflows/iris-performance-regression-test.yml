name: Iris Performance Regression Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'iris-dev-triton-aafec41' }}

permissions:
  contents: read

jobs:
  performance-test:
    name: GEMM All-Scatter benchmarks (8 ranks)
    runs-on: [linux-mi350-8gpu-iris]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: |
          bash .github/scripts/container_build.sh

      - name: Report environment versions
        run: |
          bash .github/scripts/report_versions.sh

      # One job runs all four benchmarks back to back. Each needs the whole node
      # for about 75 s, but as separate jobs each held a runner slot while it
      # waited for 8 free GPUs -- for up to 2.4 h. gpu_task_queue.py takes the
      # GPUs per benchmark and reserves the node so they are not starved by
      # smaller tasks.
      #
      # Baselines were measured on AMD Instinct MI325X (8 GPUs), before CI moved
      # to the MI350X runners -- re-measure before tightening thresholds.
      # Thresholds are ~80% of the measured TFLOPs noted alongside.
      - name: Run benchmarks
        run: |
          python3 .github/scripts/gpu_task_queue.py \
            --task 8 "GEMM All-Scatter WG Specialization" \
              "bash .github/scripts/run_perf_benchmark.sh 10_gemm_all_scatter_wg_specialization 1440 -m 16384 -n 16384 -k 16384 --BLK_M 128 --BLK_N 128 --BLK_K 64 --gsize_m 6 --gemm_sms 192" \
            --task 8 "GEMM All-Scatter" \
              "bash .github/scripts/run_perf_benchmark.sh 07_gemm_all_scatter 1000 -m 16384 -n 16384 -k 16384 --BLK_M 256 --BLK_N 64 --BLK_K 64 --gsize_m 6 --gemm_sms 256" \
            --task 8 "GEMM All-Scatter Producer-Consumer" \
              "bash .github/scripts/run_perf_benchmark.sh 11_gemm_all_scatter_producer_consumer 1600 -m 16384 -n 16384 -k 16384 --BLK_M 128 --BLK_N 128 --BLK_K 64 --gsize_m 6 --gemm_sms 256 --comm_sms 48" \
            --task 8 "GEMM All-Scatter Bulk Synchronous" \
              "bash .github/scripts/run_perf_benchmark.sh 12_gemm_all_scatter_bulk_synchronous 900 -m 16384 -n 16384 -k 16384 --BLK_M 128 --BLK_N 128 --BLK_K 64 --gsize_m 6 --gemm_sms 256"

      - name: Release GPUs
        if: always()
        run: |
          bash .github/scripts/release_gpus.sh
