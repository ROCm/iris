name: Iris External Validation Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKER_IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'iris-dev-triton-aafec41' }}

permissions:
  contents: read

jobs:
  external-validation-test:
    name: External Validation Tests (Triton and Gluon)
    runs-on: [linux-mi350-8gpu-iris]
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Apptainer (if not available)
        run: |
          if ! command -v apptainer &> /dev/null && ! command -v docker &> /dev/null; then
            echo "Neither Apptainer nor Docker found, installing Apptainer..."
            apt-get update && apt-get install -y software-properties-common
            add-apt-repository -y ppa:apptainer/ppa
            apt-get update && apt-get install -y apptainer
          else
            echo "Container runtime already available"
          fi

      - name: Build Iris container
        run: |
          bash .github/scripts/container_build.sh

      - name: Report environment versions
        run: |
          bash .github/scripts/report_versions.sh

      # Both tests share one job and run side by side on 2 GPUs each, so the
      # pair holds one runner slot instead of two while waiting for GPUs.
      - name: Run external validation tests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/gpu_task_queue.py \
            --task 2 "External Validation Test" "bash .github/scripts/run_external_validation.sh triton" \
            --task 2 "External Gluon Validation Test" "bash .github/scripts/run_external_validation.sh gluon"

      - name: Release GPUs
        if: always()
        run: |
          bash .github/scripts/release_gpus.sh
