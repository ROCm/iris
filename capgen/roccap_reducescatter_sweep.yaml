# Config for roccap_ccl_sweep.py — reduce-scatter (example 27_ccl_reduce_scatter)
#
# Shape knobs: paired tensor_mn × block_mn × args (same pattern as roccap_alltoall_sweep.yaml).
#
# Run (adjust paths if needed):
#   python3 /workspaces/pre_silicon_sw_dev/roccap_ccl_sweep.py --config /workspaces/pre_silicon_sw_dev/roccap_reducescatter_sweep.yaml
#
# roccap -k must match the Triton kernel name in iris/ccl/reduce_scatter.py

tensor_mn:
  - {m: 2048, n: 2048}
  # - {m: 1024, n: 512}

block_mn:
  - {block_size_m: 64, block_size_n: 64}
  - {block_size_m: 128, block_size_n: 64}
  - {block_size_m: 128, block_size_n: 128}
  - {block_size_m: 256, block_size_n: 128}
  - {block_size_m: 256, block_size_n: 256}

workdir: ""

torchrun:
  nproc_per_node: [8]
  standalone: true

paths:
  wrapper: /workspaces/pre_silicon_sw_dev/iris-jonathou-hints/scripts/roccap_wrapper.py
  example: /workspaces/pre_silicon_sw_dev/iris-jonathou-hints/examples/27_ccl_reduce_scatter/example.py

kernel: persistent_reduce_scatter_two_shot

# Required in paired mode: comm_sms, cache_modifier, num_warps, datatype.
# Do not set all_gather_variant / all_to_all_variant — example 27 does not define those flags.
args:
  comm_sms: [48, 64, 96]
  cache_modifier: [".cs"]
  num_warps: [32]
  datatype: [fp32]

extra:
  num_stages: [1]
  waves_per_eu: []
  heap_size: []

rename:
  enabled: true

logging:
  dir: sweep_logs
  tee: false
